workflows:
  ios-release:
    name: iOS TestFlight Automatic Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic CI Key
    environment:
      ios_signing:
        provisioning_profiles:
          - flutter_kickstart_production
        certificates:
          - Codemagic Distribution Certificate
          - Kanetech Distribution Certificate
      flutter: default
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "pro.kanetech.flutterkickstart"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Set up code signing settings on Codemagic
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Flutter build ipa and generate artifacts
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /Users/builder/export_options.plist
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Internal Testers"

  android-release:
    name: Android Google Play Internal Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: default
      groups:
        - google_play_credentials # Codemagic縺ｫ逋ｻ骭ｲ縺励◆GCP繧ｵ繝ｼ繝薙せ繧｢繧ｫ繧ｦ繝ｳ繝育ｭ峨・繧ｰ繝ｫ繝ｼ繝怜錐
      vars:
        PACKAGE_NAME: "pro.kanetech.flutterkickstart"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Set up keystore
        script: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/upload-keystore.jks
          cat >> "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=/tmp/upload-keystore.jks
          EOF
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build Android App Bundle (.aab)
        script: |
          flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false


